<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070f" />
    <meta name="description" content="CareBuddy — calm, structured reminder and care support." />
    <title>CareBuddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600;700&family=Cal+Sans&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="app-aurora" aria-hidden="true">
      <div class="aurora aurora-1"></div>
      <div class="aurora aurora-2"></div>
      <div class="aurora aurora-3"></div>
    </div>

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <div class="brand__icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 2.5C6.5 2.5 3.5 5.3 3.5 9c0 2.4 1.2 4.5 3 5.7l.5 2.3c.1.3.4.5.7.5h4.6c.3 0 .6-.2.7-.5l.5-2.3c1.8-1.2 3-3.3 3-5.7 0-3.7-3-6.5-6.5-6.5z" fill="url(#icon-grad)"/>
              <path d="M7.5 14.5h5" stroke="#042f2e" stroke-width="1.5" stroke-linecap="round"/>
              <defs>
                <linearGradient id="icon-grad" x1="3.5" y1="2.5" x2="16.5" y2="17.5" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#2dd4bf"/>
                  <stop offset="1" stop-color="#0d9488"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="brand__text">
            <span class="brand__name">CareBuddy</span>
            <span class="brand__tagline">Calm. Structured. Personal.</span>
          </div>
        </div>
        <div class="topbar__right">
          <div class="status-chip" id="status-chip">
            <span class="status-dot"></span>
            <span id="status-label">Connecting…</span>
          </div>
          <button class="icon-btn" id="btn-sidebar-toggle" aria-label="Toggle menu">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <rect y="3" width="18" height="2" rx="1" fill="currentColor"/>
              <rect y="8" width="18" height="2" rx="1" fill="currentColor"/>
              <rect y="13" width="18" height="2" rx="1" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="shell">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <nav class="sidebar__nav">
          <div class="sidebar-section">
            <p class="sidebar-label">At a glance</p>
            <div class="next-card" id="sidebar-next">
              <div class="skeleton-block" style="height:48px"></div>
            </div>
          </div>

          <div class="sidebar-section">
            <p class="sidebar-label">Quick actions</p>
            <button class="sidebar-action" id="btn-open-reminder">
              <span class="sidebar-action__icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </span>
              Add reminder
            </button>
            <button class="sidebar-action sidebar-action--ghost" id="btn-open-settings">
              <span class="sidebar-action__icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.93 2.93l1.41 1.41M11.66 11.66l1.41 1.41M2.93 13.07l1.41-1.41M11.66 4.34l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </span>
              Settings
            </button>
          </div>

          <div class="sidebar-section sidebar-section--grow">
            <p class="sidebar-label">Upcoming</p>
            <div id="sidebar-upcoming" class="sidebar-upcoming">
              <div class="skeleton-block" style="height:80px"></div>
            </div>
          </div>

          <div class="sidebar-footer" id="api-key-hint"></div>
        </nav>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

      <!-- Main -->
      <main class="main" id="main-content">
        <div class="workspace">
          <!-- Left column: profile + dashboard -->
          <div class="col-left">
            <div class="widget">
              <div class="widget__header">
                <h2 class="widget__title">Profile</h2>
                <button class="icon-btn icon-btn--sm" id="btn-edit-profile" aria-label="Edit profile">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5L11.5 4.5L5 11H3V9L9.5 2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <dl class="profile-grid" id="profile-kv">
                <div class="skeleton-block" style="height:72px"></div>
              </dl>
            </div>

            <div class="widget widget--accent">
              <div class="widget__header">
                <h2 class="widget__title">Next reminder</h2>
                <span class="badge badge--teal" id="next-badge" hidden>Soon</span>
              </div>
              <div id="panel-next" class="next-reminder-content">
                <div class="skeleton-block" style="height:56px"></div>
              </div>
            </div>

            <div class="widget">
              <div class="widget__header">
                <h2 class="widget__title">Today</h2>
                <span class="badge" id="today-count"></span>
              </div>
              <ul class="today-list" id="today-list" aria-label="Today's reminders">
                <div class="skeleton-block" style="height:64px"></div>
              </ul>
            </div>

            <div class="widget">
              <div class="widget__header">
                <h2 class="widget__title">Daily summary</h2>
              </div>
              <div class="summary-box" id="daily-summary"></div>
            </div>
          </div>

          <!-- Right column: tabs -->
          <div class="col-right">
            <div class="tabbed-panel">
              <div class="tab-bar" role="tablist">
                <button class="tab-btn is-active" role="tab" aria-selected="true" data-tab="chat">
                  <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1C3.9 1 1 3.5 1 6.7c0 1.6.7 3 1.9 4l-.4 2.8 2.7-1.3C5.8 12.4 6.6 12.5 7.5 12.5c3.6 0 6.5-2.6 6.5-5.8C14 3.5 11.1 1 7.5 1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                  Chat
                </button>
                <button class="tab-btn" role="tab" aria-selected="false" data-tab="calendar">
                  <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1" y="2.5" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 1v3M10 1v3M1 6h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                  Calendar
                </button>
                <button class="tab-btn" role="tab" aria-selected="false" data-tab="reminders">
                  <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 4h9M3 7.5h9M3 11h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                  Reminders
                </button>
              </div>

              <div class="tab-content">
                <!-- CHAT -->
                <div class="tab-pane is-visible" id="panel-chat" role="tabpanel">
                  <div class="chat-toolbar">
                    <label class="upload-btn" title="Attach medicine label photo">
                      <input type="file" id="chat-image" accept="image/png,image/jpeg,image/webp" hidden />
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 11l3-3 2 2 3-4 4 5H2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><rect x="1" y="1" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.4"/></svg>
                      Label photo
                    </label>
                    <span class="toolbar-hint">Images are for label reading only — not medical diagnosis.</span>
                  </div>
                  <div class="chat-log" id="chat-log" aria-live="polite" aria-label="Chat messages"></div>
                  <form class="chat-compose" id="chat-form" autocomplete="off">
                    <div class="compose-inner">
                      <label class="sr-only" for="chat-input">Message CareBuddy</label>
                      <textarea
                        id="chat-input"
                        class="compose-textarea"
                        rows="1"
                        placeholder="Ask CareBuddy anything…"
                        autocomplete="off"
                        spellcheck="true"
                      ></textarea>
                      <button type="submit" class="send-btn" id="chat-send" aria-label="Send message">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L14 2L10 8L14 14L2 8Z" fill="currentColor"/></svg>
                      </button>
                    </div>
                  </form>
                </div>

                <!-- CALENDAR -->
                <div class="tab-pane" id="panel-calendar" role="tabpanel" hidden>
                  <div class="cal-controls">
                    <div class="seg-control" role="group" aria-label="Calendar view">
                      <button class="seg-btn is-active" data-cal-mode="daily">Daily</button>
                      <button class="seg-btn" data-cal-mode="weekly">Weekly</button>
                    </div>
                    <div id="calendar-date-controls" class="cal-date-row"></div>
                  </div>
                  <div id="calendar-body" class="cal-body"></div>
                </div>

                <!-- ALL REMINDERS -->
                <div class="tab-pane" id="panel-reminders" role="tabpanel" hidden>
                  <div class="reminders-header">
                    <span class="reminders-count" id="reminders-total"></span>
                    <button class="text-btn" id="btn-open-reminder-tab">+ Add reminder</button>
                  </div>
                  <div id="all-reminders" class="reminder-list"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Add reminder modal -->
    <div class="modal" id="modal-reminder" role="dialog" aria-modal="true" aria-labelledby="modal-reminder-title" hidden>
      <div class="modal__scrim" data-close-modal></div>
      <div class="modal__box" role="document">
        <header class="modal__head">
          <div class="modal__head-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <h2 id="modal-reminder-title" class="modal__title">New reminder</h2>
          <button class="icon-btn" data-close-modal aria-label="Close">&times;</button>
        </header>
        <form id="form-reminder" class="modal__form">
          <div class="field-row">
            <div class="field">
              <label class="field-label">Type</label>
              <select name="kind" class="field-input">
                <option value="medicine">💊 Medicine</option>
                <option value="general">📋 General</option>
              </select>
            </div>
            <div class="field field--grow">
              <label class="field-label">Schedule</label>
              <select name="schedule_type" id="reminder-schedule-type" class="field-input"></select>
            </div>
          </div>
          <div class="field">
            <label class="field-label">Title</label>
            <input name="title" type="text" class="field-input" required placeholder="e.g. Blood pressure pill, Doctor appointment" />
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label">Date</label>
              <input name="reminder_date" type="date" class="field-input" required />
            </div>
            <div class="field">
              <label class="field-label">Time</label>
              <input name="reminder_time" type="time" class="field-input" required />
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label">Place <span class="optional">optional</span></label>
              <input name="place" type="text" class="field-input" placeholder="e.g. Home, Clinic" />
            </div>
            <div class="field">
              <label class="field-label">Notes <span class="optional">optional</span></label>
              <input name="notes" type="text" class="field-input" placeholder="Any extra info" />
            </div>
          </div>
          <div class="field">
            <label class="field-label">Schedule detail <span class="optional">weekday or description</span></label>
            <input name="schedule_detail" type="text" class="field-input" placeholder="e.g. Monday, first of each month" />
          </div>
          <div class="modal__actions">
            <button type="button" class="btn-ghost" data-close-modal>Cancel</button>
            <button type="submit" class="btn-primary">Save reminder</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Settings modal -->
    <div class="modal" id="modal-settings" role="dialog" aria-modal="true" aria-labelledby="modal-settings-title" hidden>
      <div class="modal__scrim" data-close-modal></div>
      <div class="modal__box modal__box--wide" role="document">
        <header class="modal__head">
          <div class="modal__head-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.4 3.4l1.4 1.4M13.2 13.2l1.4 1.4M3.4 14.6l1.4-1.4M13.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <h2 id="modal-settings-title" class="modal__title">Settings</h2>
          <button class="icon-btn" data-close-modal aria-label="Close">&times;</button>
        </header>
        <form id="form-settings" class="modal__form">
          <p class="modal__section-label">Your profile</p>
          <div class="field-row">
            <div class="field">
              <label class="field-label">Name</label>
              <input name="name" type="text" class="field-input" autocomplete="name" placeholder="Your name" />
            </div>
            <div class="field">
              <label class="field-label">Age</label>
              <input name="age" type="text" class="field-input" inputmode="numeric" placeholder="e.g. 72" />
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label">Language</label>
              <select name="language" id="settings-language" class="field-input"></select>
            </div>
            <div class="field">
              <label class="field-label">Timezone</label>
              <input name="timezone" type="text" class="field-input" placeholder="e.g. America/New_York" />
            </div>
          </div>
          <div class="field">
            <label class="field-label">Reminder style</label>
            <select name="reminder_style" id="settings-reminder-style" class="field-input"></select>
          </div>

          <p class="modal__section-label">Integrations</p>
          <div class="field">
            <label class="field-label">OpenAI API key <span class="optional">stored in memory only</span></label>
            <input name="openai_api_key" type="password" class="field-input" autocomplete="off" placeholder="sk-… (leave blank to use server key)" />
          </div>
          <div class="field-row">
            <div class="field">
              <label class="field-label">Notification channel</label>
              <select name="notification_channel" class="field-input">
                <option value="email">Email</option>
                <option value="twilio">Twilio SMS</option>
                <option value="ntfy">ntfy push</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label">Destination</label>
              <input name="notification_destination" type="text" class="field-input" placeholder="Email or phone or topic" />
            </div>
          </div>
          <div class="modal__actions">
            <button type="button" class="btn-ghost" data-close-modal>Cancel</button>
            <button type="submit" class="btn-primary">Save settings</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toasts" class="toast-tray" aria-live="assertive" aria-atomic="false"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="/static/js/app.js" defer></script>
  </body>
</html>
